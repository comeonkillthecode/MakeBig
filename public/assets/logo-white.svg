<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
    <defs>
        <linearGradient id="mbMonoGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E2E8F0" />
        </linearGradient>
        <linearGradient id="mbMonoOrbitWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4" />
        </linearGradient>
    </defs>

    <!-- MARK / ICON (Left: 0 - 64) -->
    <g transform="translate(4, 4)">
        <!-- Outer Orbit Track & Arrow -->
        <path d="M 44 14 A 23 23 0 0 1 45 42 L 39 37 M 45 42 L 51 40" 
              stroke="url(#mbMonoOrbitWhite)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 12 42 A 23 23 0 0 1 11 14 L 17 19 M 11 14 L 5 16" 
              stroke="url(#mbMonoOrbitWhite)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Network Data Nodes & Transmission Lines -->
        <line x1="2" y1="20" x2="14" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="2" cy="20" r="2.5" fill="#FFFFFF"/>
        
        <line x1="8" y1="12" x2="18" y2="12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8" cy="12" r="2" fill="#FFFFFF"/>

        <line x1="42" y1="44" x2="54" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="54" cy="44" r="2.5" fill="#FFFFFF"/>

        <line x1="38" y1="52" x2="48" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="48" cy="52" r="2" fill="#FFFFFF"/>

        <!-- Central Globe / Sphere -->
        <circle cx="28" cy="28" r="17" stroke="url(#mbMonoGradWhite)" stroke-width="2.5" fill="#141416" fill-opacity="0.8"/>
        <!-- Longitude lines -->
        <ellipse cx="28" cy="28" rx="8.5" ry="17" stroke="#CBD5E1" stroke-width="1.75" fill="none"/>
        <line x1="28" y1="11" x2="28" y2="45" stroke="#CBD5E1" stroke-width="1.75"/>
        <!-- Latitude lines -->
        <line x1="13" y1="22" x2="43" y2="22" stroke="#CBD5E1" stroke-width="1.5"/>
        <line x1="13" y1="34" x2="43" y2="34" stroke="#CBD5E1" stroke-width="1.5"/>
        
        <!-- Center Core -->
        <circle cx="28" cy="28" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- WORDMARK & TAGLINE -->
    <g transform="translate(74, 37)">
        <!-- "MAKE" in bold white -->
        <text x="0" y="0" 
              font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="28" 
              font-weight="800" 
              letter-spacing="0.5" 
              fill="#FFFFFF">MAKE</text>
        
        <!-- "BIG" in extra-bold silver -->
        <text x="86" y="0" 
              font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="28" 
              font-weight="900" 
              letter-spacing="1" 
              fill="#E2E8F0">BIG</text>
        
        <!-- Subtitle: "DIGITAL SOLUTIONS" -->
        <text x="1" y="16.5" 
              font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="8.5" 
              font-weight="600" 
              letter-spacing="3.2" 
              fill="#94A3B8">DIGITAL SOLUTIONS</text>
    </g>
</svg>
